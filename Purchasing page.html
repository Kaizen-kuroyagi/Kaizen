<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>KaizenTech — Checkout</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="header">
      <div class="container">
        <div class="navbar">
          <a class="logo" href="Index.html">
            <img src="images/large.png" width="125" alt="KaizenTech">
          </a>
          <nav>
            <ul>
              <li><a href="Index.html">Home</a></li>
              <li><a href="Purchasing page.html">Products</a></li>
              <li><a href="electronics.html">Account</a></li>
            </ul>
          </nav>
          <img src="images/car.png" width="30" height="30" alt="Shopping Cart">
        </div>
      </div>
    </header>

    <main class="small-container checkout-page">
      <h1>Checkout</h1>
      <div class="checkout-layout">
        <section class="checkout-card">
          <form>
            <h2>Contact &amp; Shipping</h2>
            <div class="checkout-field">
              <label for="customer-name">Full name</label>
              <input id="customer-name" type="text" placeholder="Jane Doe">
            </div>
            <div class="checkout-field">
              <label for="customer-email">Email</label>
              <input id="customer-email" type="email" placeholder="jane@example.com">
            </div>
            <div class="checkout-field">
              <label for="customer-address">Address</label>
              <input id="customer-address" type="text" placeholder="123 Market St">
            </div>

            <h2 class="payment-heading">Payment</h2>
            <div class="checkout-field">
              <label for="cardholder-name">Cardholder name</label>
              <input id="cardholder-name" type="text" placeholder="Jane Doe">
            </div>
            <div class="checkout-fields-row">
              <div class="checkout-field">
                <label for="card-number">Card number</label>
                <input id="card-number" type="text" placeholder="4242 4242 4242 4242">
              </div>
              <div class="checkout-field">
                <label for="card-exp">Exp</label>
                <input id="card-exp" type="text" placeholder="MM/YY">
              </div>
            </div>
            <div class="checkout-field">
              <label for="card-cvc">CVC</label>
              <input id="card-cvc" type="text" placeholder="123">
            </div>
          </form>
        </section>

        <aside class="checkout-card order-summary">
          <h2>Your order</h2>
          <p>Your cart is empty. Add products to see them here.</p>
          <hr>
          <div class="summary-line"><span>Shipping</span><span>$0.00</span></div>
          <div class="summary-line summary-total"><span>Total</span><span>$0.00</span></div>
        </aside>
      </div>
    </main>

    <footer class="site-footer">KaizenTech © 2026</footer>
  </body>
</html>
