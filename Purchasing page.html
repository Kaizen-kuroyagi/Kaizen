<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Checkout — TechMart</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header>
      <div class="container nav">
        <div class="brand">
          <div class="logo">T</div>
          <div>
            <div>TechMart</div>
            <div class="muted">Smart gadgets, fair prices</div>
          </div>
        </div>
        <nav>
          <a href="Home page.html">Home</a>
          <a href="#">Products</a>
          <a href="#">Support</a>
        </nav>
      </div>
    </header>

    <main class="container" style="padding:40px 0">
      <h2>Checkout</h2>
      <div style="display:grid;grid-template-columns:1fr 380px;gap:28px;margin-top:18px">
        <section>
          <h3>Contact & Shipping</h3>
          <form>
            <label style="display:block;margin:8px 0 4px">Full name</label>
            <input type="text" placeholder="Jane Doe" style="width:100%;padding:10px;border-radius:6px;border:1px solid #ddd">

            <label style="display:block;margin:8px 0 4px">Email</label>
            <input type="email" placeholder="jane@example.com" style="width:100%;padding:10px;border-radius:6px;border:1px solid #ddd">

            <label style="display:block;margin:8px 0 4px">Address</label>
            <input type="text" placeholder="123 Market St" style="width:100%;padding:10px;border-radius:6px;border:1px solid #ddd">

                  </div>
                  

                <h3 style="margin-top:18px">Payment</h3>
                <label style="display:block;margin:8px 0 4px">Cardholder name</label>
                <input type="text" placeholder="Jane Doe" style="width:100%;padding:10px;border-radius:6px;border:1px solid #ddd">

                <div style="display:flex;gap:8px">
                  <div style="flex:2">
                    <label style="display:block;margin:8px 0 4px">Card number</label>
                    <input id="card-number" type="text" placeholder="4242 4242 4242 4242" style="width:100%;padding:10px;border-radius:6px;border:1px solid #ddd">
                  </div>
                  <div style="flex:1">
                    <label style="display:block;margin:8px 0 4px">Exp</label>
                    <input id="card-exp" type="text" placeholder="MM/YY" style="width:100%;padding:10px;border-radius:6px;border:1px solid #ddd">
                  </div>
                </div>

                <label style="display:block;margin:8px 0 4px">CVC</label>
                <input id="card-cvc" type="text" placeholder="123" style="width:100px;padding:10px;border-radius:6px;border:1px solid #ddd">

              </form>
            </section>

            <aside class="card" id="order-summary">
              <h3 style="margin-top:0">Your order</h3>
              <div id="items"></div>
              <hr>
              <div style="display:flex;justify-content:space-between;margin:12px 0"><div class="muted">Shipping</div><div id="shipping">$0.00</div></div>
              <div style="display:flex;justify-content:space-between;font-weight:700;margin-top:10px"><div>Total</div><div id="total">$0.00</div></div>
              <a href="#" class="cta" id="pay-btn" style="display:block;text-align:center;margin-top:18px">Pay</a>
            </aside>

          </div>
        </main>

        <footer>
          <div class="container" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
            <div>
              <strong>TechMart</strong>
              <div class="muted">© 2026 TechMart Inc.</div>
            </div>

            <div style="display:flex;align-items:center;gap:20px">
              <div class="social">
                <a href="https://twitter.com/techmart" aria-label="Twitter">T</a>
                <a href="https://instagram.com/techmart" aria-label="Instagram">I</a>
                <a href="https://facebook.com/techmart" aria-label="Facebook">F</a>
                <a href="https://youtube.com/techmart" aria-label="YouTube">Y</a>
              </div>
              <div class="muted">
                <div>hello@techmart.example</div>
                <div>+1 (555) 321-9876</div>
              </div>
            </div>
          </div>
        </footer>

        <script>
          // Read cart from localStorage and populate order summary
          const CART_KEY = 'techmart_cart_v1';
          const shippingCost = 12.99;

          function money(n){ return '$' + n.toFixed(2); }

          function loadCart(){
            try{ return JSON.parse(localStorage.getItem(CART_KEY)) || []; }catch(e){return []}
          }

          function renderOrder(){
            const itemsEl = document.getElementById('items');
            const shippingEl = document.getElementById('shipping');
            const totalEl = document.getElementById('total');
            const cart = loadCart();
            itemsEl.innerHTML = '';
            if(!cart.length){ itemsEl.innerHTML = '<div class="muted">Your cart is empty.</div>'; shippingEl.textContent = money(0); totalEl.textContent = money(0); document.getElementById('pay-btn').style.display='none'; return}
            let subtotal = 0;
            cart.forEach(it=>{
              const row = document.createElement('div');
              row.style.display='flex'; row.style.justifyContent='space-between'; row.style.margin='12px 0';
              row.innerHTML = `<div><strong>${it.name}</strong><div class="muted" style="font-size:12px">Qty ${it.qty}</div></div><div>${money(it.price*it.qty)}</div>`;
              itemsEl.appendChild(row);
              subtotal += it.price*it.qty;
            });
            shippingEl.textContent = money(shippingCost);
            totalEl.textContent = money(subtotal + shippingCost);
          }

          document.addEventListener('DOMContentLoaded', renderOrder);
          document.getElementById('pay-btn').addEventListener('click', function(e){ e.preventDefault(); alert('Payment simulated — thank you!'); localStorage.removeItem(CART_KEY); renderOrder(); });
        </script>

      </body>
      </html>
